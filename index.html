<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Shape Grid</title>

  <style>
  body {
    margin: 0;
    overflow: hidden; /* 🔥 hides cropped edges */
    background: #fff;
  }

  .grid-wrapper {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 100vmax;
    height: 100vmax;
    transform: translate(-50%, -50%);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    width: 100%;
    height: 100%;
  }

  .cell {
    aspect-ratio: 1 / 1;
    overflow: hidden;
  }

  .cell img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* or cover if you want fill */
    display: block;
  }
</style>

<body>
  <div class="grid-wrapper">
    <div class="grid">
      <div class="cell"><img id="img1"></div>
      <div class="cell"><img id="img2"></div>
      <div class="cell"><img id="img3"></div>
      <div class="cell"><img id="img4"></div>
    </div>
  </div>

  <script>
    const TOTAL_SHAPES = 36;
    const PATH = "shapes/";

    function getRandomShape() {
      const num = Math.floor(Math.random() * TOTAL_SHAPES) + 1;
      return `${PATH}shape${num}.svg?v=${Date.now()}`;
    }

    function startRandomizer(id, interval) {
      const el = document.getElementById(id);

      function update() {
        el.src = getRandomShape();
      }

      update();
      setInterval(update, interval);
    }

    startRandomizer("img1", 1000);
    startRandomizer("img2", 7500);
    startRandomizer("img3", 5000);
    startRandomizer("img4", 12000);
  </script>
</body>
</html>
